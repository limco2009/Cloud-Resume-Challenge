name: Deploy Website & Infrastructure

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.11.0"

jobs:
  # ============================================================================
  # JOB 1: RUNS ON PULL REQUESTS ONLY (Read-Only OIDC Role + PR Comment)
  # ============================================================================
  plan:
    name: Terraform Plan (PR Preview)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      id-token: write       # Required for AWS OIDC authentication
      contents: read        # Required to checkout repository code
      pull-requests: write  # Required to post the plan comment on the PR

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python & Lint
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python Syntax
        run: python -m py_compile counter.py

      - name: Configure Read-Only AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Format & Validate
        id: validate
        run: |
          terraform fmt -check
          terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: true

      # Post or update the Terraform Plan output as a comment on the Pull Request
      - name: Post Terraform Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
        with:
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.validate.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`\n
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            // Find an existing comment from this workflow to update it instead of duplicating
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes('#### Terraform Plan')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output
              });
            }

      # Fail the workflow check if terraform plan encountered an error
      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ============================================================================
  # JOB 2: RUNS ON PUSH TO MAIN ONLY (Main-Locked Deploy OIDC Role)
  # ============================================================================
  deploy:
    name: Terraform Apply (Production)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python & Lint
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python Syntax
        run: python -m py_compile counter.py

      - name: Configure Deploy AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format & Validate
        run: |
          terraform fmt -check
          terraform validate

      - name: Terraform Apply
        run: terraform apply -auto-approve
